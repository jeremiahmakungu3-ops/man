# FreeRADIUS clients configuration for XCLOUD
# Allows all routers in WireGuard subnet 10.88.0.0/16 and localhost

client localhost {
    ipaddr = 127.0.0.1
    proto = *
    secret = xcloudRadiusSecretKey2026
    require_message_authenticator = no
    nas_type = other
}

client xcloud_wireguard_network {
    ipaddr = 10.88.0.0
    netmask = 16
    proto = *
    secret = xcloudRadiusSecretKey2026
    require_message_authenticator = no
    nas_type = mikrotik
    limit {
        max_connections = 256
        lifetime = 0
        idle_timeout = 30
    }
}
