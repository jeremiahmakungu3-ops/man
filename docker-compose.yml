version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: xcloud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xcloud_production}
      POSTGRES_USER: ${POSTGRES_USER:-xcloud_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_postgres_password_here}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./radius/sql/schema.sql:/docker-entrypoint-initdb.d/01-freeradius.sql
    networks:
      - xcloud_net

  redis:
    image: redis:7-alpine
    container_name: xcloud_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - xcloud_net

  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: xcloud_radius
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: ${POSTGRES_USER:-xcloud_admin}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-secure_postgres_password_here}
      DATABASE_NAME: ${POSTGRES_DB:-xcloud_production}
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./radius/clients.conf:/etc/freeradius/clients.conf:ro
      - ./radius/mods-enabled/sql:/etc/freeradius/mods-enabled/sql:ro
    networks:
      - xcloud_net

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: xcloud_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    networks:
      - xcloud_net

  celery_worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: xcloud_celery_worker
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    env_file:
      - .env.example
    command: celery -A config worker -l info -c 4
    networks:
      - xcloud_net

  celery_beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: xcloud_celery_beat
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    env_file:
      - .env.example
    command: celery -A config beat -l info
    networks:
      - xcloud_net

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: xcloud_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend
    networks:
      - xcloud_net

  nginx:
    image: nginx:alpine
    container_name: xcloud_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
    depends_on:
      - frontend
      - backend
    networks:
      - xcloud_net

networks:
  xcloud_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:
