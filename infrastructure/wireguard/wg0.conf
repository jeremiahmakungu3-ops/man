# /etc/wireguard/wg0.conf
# XCLOUD Central WireGuard VPN Gateway Server

[Interface]
Address = 10.88.0.1/16
ListenPort = 51820
PrivateKey = REPLACE_WITH_SERVER_PRIVATE_KEY
SaveConfig = false

# PostUp/PostDown firewall rules for forwarding to FreeRADIUS & Billing API
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# Router 01: Core Gateway - Kariakoo (MikroTik CCR2004)
[Peer]
PublicKey = wG+KariakooCorePublicServerKey789123456789=
AllowedIPs = 10.88.0.2/32

# Router 02: Arusha Hub (MikroTik RB4011)
[Peer]
PublicKey = wG+ArushaClockTowerPubPeerKey1234567890=
AllowedIPs = 10.88.0.3/32

# Router 03: Mwanza Omada Gateway (TP-Link ER7206)
[Peer]
PublicKey = wG+OmadaMwanzaMallPubKey987654321012345=
AllowedIPs = 10.88.0.5/32
